{% extends 'base.html' %}
{% block title %}429 — Too Many Requests{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-code">429</div>
  <div class="error-msg">Slow Down</div>
  <div class="error-sub">You've made too many requests. Please wait a moment and try again.</div>
  <a href="{{ url_for('index') }}" class="btn btn-primary">Go Home</a>
</div>
{% endblock %}
