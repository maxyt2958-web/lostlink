{% extends 'base.html' %}
{% block title %}Sign Up — Lost & Found{% endblock %}
{% block content %}

<div class="auth-wrap">
  <div class="auth-logo">
    <h1>Create your account</h1>
    <p>Join the community helping reunite lost items with their owners.</p>
  </div>

  <div class="card">
    <div class="card-body">
      <form method="POST" action="{{ url_for('register') }}">
        <div class="field">
          <label for="username">Username <span class="req">*</span></label>
          <input type="text" id="username" name="username" placeholder="e.g. john_doe" required autofocus>
        </div>
        <div class="field">
          <label for="email">Email <span class="req">*</span></label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password <span class="req">*</span></label>
          <input type="password" id="password" name="password" placeholder="At least 6 characters" required>
        </div>
        <div class="field">
          <label for="confirm_password">Confirm Password <span class="req">*</span></label>
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat password" required>
        </div>
        <button type="submit" class="btn btn-primary w-full mt-2">Create Account →</button>
      </form>
    </div>
  </div>

  <div class="auth-footer">
    Already have an account? <a href="{{ url_for('login') }}">Log in</a>
  </div>
</div>

{% endblock %}
